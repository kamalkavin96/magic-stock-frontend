<!DOCTYPE html>
<html>
<body>
  <input type="file" id="video" accept=".mkv">
  <button id="btn">Convert</button>

  <script type="module">
    import { FFmpeg } from
      "https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/esm/index.js";
    import { fetchFile } from
      "https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js";

    const ffmpeg = new FFmpeg();

    document.getElementById("btn").onclick = async () => {
      await ffmpeg.load({
        coreURL: "https://unpkg.com/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js"
      });

      const file = document.getElementById("video").files[0];
      await ffmpeg.writeFile("input.mkv", await fetchFile(file));

      await ffmpeg.exec(["-i", "input.mkv", "-c", "copy", "output.mp4"]);

      const data = await ffmpeg.readFile("output.mp4");

      const url = URL.createObjectURL(
        new Blob([data.buffer], { type: "video/mp4" })
      );

      const a = document.createElement("a");
      a.href = url;
      a.download = "output.mp4";
      a.click();
    };
  </script>
</body>
</html>
